name: Documentation Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Environment variables
env:
  PYTHON_VERSION: '3.11'
  DOCS_DIR: docs
  SITE_DIR: site

# Permissions
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # Build Documentation
  # ============================================================================
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs>=1.5.0
          pip install mkdocs-material>=9.4.0
          pip install mkdocs-minify-plugin>=0.7.0
          pip install mkdocs-redirects>=1.2.0
          pip install mkdocs-git-revision-date-localized-plugin>=1.2.0
          pip install mkdocs-git-committers-plugin-2>=2.0.0
          pip install mkdocs-git-authors-plugin>=0.7.0
          pip install mkdocs-exclude>=1.0.0
          pip install pymdown-extensions>=10.0.0
          pip install mike>=1.1.0
          
      - name: Build documentation
        run: |
          mkdocs build --strict --verbose
          
      - name: Check for broken internal links
        run: |
          pip install linkchecker
          linkchecker site/ --ignore-url=.*github.com.* --no-status --timeout=10
          
      - name: Validate navigation structure
        run: |
          python scripts/validate_navigation.py --docs-dir ${{ env.DOCS_DIR }}
          
      - name: Check image optimization
        run: |
          pip install pillow
          python scripts/optimize_images.py --docs-dir ${{ env.DOCS_DIR }} --check-only
          
      - name: Generate API documentation
        run: |
          pip install pdoc
          pdoc --html --output-dir ${{ env.SITE_DIR }}/api app/
          
      - name: Generate OpenAPI documentation
        run: |
          pip install redoc-cli
          redoc-cli bundle openapi.yaml --output ${{ env.SITE_DIR }}/api/redoc.html
          
      - name: Build search index
        run: |
          mkdocs build --clean
          
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: ${{ env.SITE_DIR }}/
          retention-days: 7
          
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-logs
          path: |
            mkdocs.log
            linkchecker-output.html

  # ============================================================================
  # Deploy to GitHub Pages
  # ============================================================================
  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ${{ env.SITE_DIR }}
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================================
  # Deploy to AWS S3 (Staging)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging (S3)
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'staging')
    environment:
      name: staging
      url: https://staging.docs.drone-detector.com
    
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ${{ env.SITE_DIR }}
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Sync to S3
        run: |
          aws s3 sync ${{ env.SITE_DIR }}/ s3://staging.docs.drone-detector.com/ \
            --delete \
            --cache-control "max-age=3600"
            
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_STAGING_ID }} \
            --paths "/*"

  # ============================================================================
  # Deploy to AWS S3 (Production)
  # ============================================================================
  deploy-production:
    name: Deploy to Production (S3)
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'production')
    environment:
      name: production
      url: https://docs.drone-detector.com
    
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ${{ env.SITE_DIR }}
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Optimize assets for production
        run: |
          # Compress images
          find ${{ env.SITE_DIR }} -name "*.png" -exec pngquant --quality=65-80 --force --ext .png {} \;
          find ${{ env.SITE_DIR }} -name "*.jpg" -exec jpegoptim --strip-all --max=85 {} \;
          
          # Minify CSS/JS
          find ${{ env.SITE_DIR }} -name "*.css" -exec cleancss -o {} {} \;
          find ${{ env.SITE_DIR }} -name "*.js" -exec uglifyjs --compress --mangle -o {} {} \;
          
      - name: Sync to S3
        run: |
          aws s3 sync ${{ env.SITE_DIR }}/ s3://docs.drone-detector.com/ \
            --delete \
            --cache-control "max-age=86400" \
            --exclude "*.html" \
            --include "*"
            
          aws s3 sync ${{ env.SITE_DIR }}/ s3://docs.drone-detector.com/ \
            --delete \
            --cache-control "max-age=300" \
            --exclude "*" \
            --include "*.html"
            
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_PROD_ID }} \
            --paths "/*"
            
      - name: Verify deployment
        run: |
          curl -f https://docs.drone-detector.com/health || exit 1
          curl -f https://docs.drone-detector.com/api/index.html || exit 1

  # ============================================================================
  # Deploy Versioned Documentation (Mike)
  # ============================================================================
  versioned-docs:
    name: Deploy Versioned Documentation
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://docs.drone-detector.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gh-pages
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install mike
        run: pip install mike mkdocs-material
          
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Deploy versioned docs
        run: |
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Fetch gh-pages branch
          git fetch origin gh-pages
          git checkout gh-pages
          
          # Build and deploy new version
          mike deploy --push --update-aliases $VERSION latest
          mike set-default --push latest
          
      - name: Verify version deployment
        run: |
          curl -f https://docs.drone-detector.com/$VERSION/ || exit 1
          curl -f https://docs.drone-detector.com/latest/ || exit 1

  # ============================================================================
  # Documentation Quality Checks
  # ============================================================================
  quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          pip install pyspelling
          pip install codespell
          pip install textstat
          
      # Spell checking
      - name: Run spell check
        run: |
          codespell ${{ env.DOCS_DIR }}/ --skip="*.html,*.svg" --ignore-words=.codespell-ignore
          
      # Grammar check
      - name: Run grammar check
        run: |
          python scripts/check_grammar.py --docs-dir ${{ env.DOCS_DIR }}
          
      # Readability analysis
      - name: Check readability
        run: |
          python scripts/readability_check.py --docs-dir ${{ env.DOCS_DIR }} --threshold 60
          
      # Word count tracking
      - name: Track documentation size
        run: |
          python scripts/doc_stats.py --docs-dir ${{ env.DOCS_DIR }} --output doc-stats.json
          
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: docs-quality-report
          path: |
            doc-stats.json
            spelling-errors.txt

  # ============================================================================
  # SEO Optimization
  # ============================================================================
  seo:
    name: SEO Optimization
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    timeout-minutes: 10
    
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ${{ env.SITE_DIR }}
          
      - name: Run Lighthouse SEO audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://docs.drone-detector.com/
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          
      - name: Generate sitemap
        run: |
          pip install mkdocs-sitemap
          mkdocs-sitemap --config mkdocs.yml
          
      - name: Generate robots.txt
        run: |
          echo "User-agent: *" > ${{ env.SITE_DIR }}/robots.txt
          echo "Allow: /" >> ${{ env.SITE_DIR }}/robots.txt
          echo "Sitemap: https://docs.drone-detector.com/sitemap.xml" >> ${{ env.SITE_DIR }}/robots.txt
          
      - name: Submit sitemap to search engines
        run: |
          curl "https://www.google.com/ping?sitemap=https://docs.drone-detector.com/sitemap.xml"
          curl "https://www.bing.com/ping?sitemap=https://docs.drone-detector.com/sitemap.xml"
          
      - name: Upload SEO report
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: lighthouse-results/

  # ============================================================================
  # PDF Generation
  # ============================================================================
  pdf:
    name: Generate PDF Documentation
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    timeout-minutes: 20
    
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ${{ env.SITE_DIR }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pdf generation tools
        run: |
          npm install -g puppeteer
          pip install weasyprint
          
      - name: Generate PDF from HTML
        run: |
          # Generate main documentation PDF
          weasyprint ${{ env.SITE_DIR }}/index.html drone-detector-docs.pdf
          
          # Generate API reference PDF
          weasyprint ${{ env.SITE_DIR }}/api/index.html api-reference.pdf
          
          # Generate user guide PDF
          weasyprint ${{ env.SITE_DIR }}/user-guide/index.html user-guide.pdf
          
      - name: Combine PDFs
        run: |
          pip install PyPDF2
          python scripts/combine_pdfs.py \
            --input drone-detector-docs.pdf api-reference.pdf user-guide.pdf \
            --output drone-detector-complete.pdf
          
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdfs
          path: |
            drone-detector-complete.pdf
            drone-detector-docs.pdf
            api-reference.pdf
            user-guide.pdf
            
      - name: Release PDF with GitHub release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: drone-detector-complete.pdf

  # ============================================================================
  # Documentation Summary
  # ============================================================================
  summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    needs: [build, quality, seo]
    if: always()
    
    steps:
      - name: Generate summary report
        run: |
          cat > docs-summary.md << EOF
          # Documentation Build Summary
          
          ## Build Information
          - **Date:** $(date)
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Event:** ${{ github.event_name }}
          
          ## Deployment Status
          - **GitHub Pages:** ${{ needs.deploy-github-pages.result }}
          - **Staging (S3):** ${{ needs.deploy-staging.result }}
          - **Production (S3):** ${{ needs.deploy-production.result }}
          - **Versioned Docs:** ${{ needs.versioned-docs.result }}
          
          ## Quality Metrics
          - **Spell Check:** ${{ needs.quality.result }}
          - **Grammar Check:** ${{ needs.quality.result }}
          - **Readability:** ${{ needs.quality.result }}
          - **SEO Audit:** ${{ needs.seo.result }}
          
          ## PDF Generation
          - **PDF Files:** ${{ needs.pdf.result }}
          
          **Documentation URL:** https://docs.drone-detector.com
          **Staging URL:** https://staging.docs.drone-detector.com
          EOF
          
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: docs-summary
          path: docs-summary.md
          
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📚 Documentation Preview\n\nDocumentation is available at:\n- **Preview:** https://staging.docs.drone-detector.com\n- **Build Artifacts:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

  # ============================================================================
  # Notification
  # ============================================================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [summary]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24
        with:
          payload: |
            {
              "text": "${{ needs.summary.result == 'success' && '📚✅' || '📚❌' }} Documentation Build",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.summary.result == 'success' && '📚✅' || '📚❌' }} *Documentation Build Completed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nURL: https://docs.drone-detector.com\nStatus: ${{ needs.summary.result }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}