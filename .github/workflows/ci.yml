name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - bugfix/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

# Cancel running workflows on new push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Code Quality & Linting
  # ============================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          
      - name: Run black (code formatting check)
        run: black --check --diff app/ tests/ scripts/
        
      - name: Run isort (import sorting check)
        run: isort --check-only --diff app/ tests/ scripts/
        
      - name: Run flake8 (style guide enforcement)
        run: flake8 app/ tests/ scripts/ --max-line-length=120 --count --statistics
        
      - name: Run pylint (code analysis)
        run: pylint app/ --exit-zero --output-format=parseable
        
      - name: Run mypy (type checking)
        run: mypy app/ --ignore-missing-imports
        
      - name: Run bandit (security linter)
        run: bandit -r app/ -c pyproject.toml -f json -o bandit-report.json
      
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          
      - name: Run pydocstyle (docstring check)
        run: pydocstyle app/ --count
        
  # ============================================================================
  # Unit Tests
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 15
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          
      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --cov=app \
            --cov=domain \
            --cov=infrastructure \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results.xml \
            --tb=short \
            -m "not slow and not hardware"
            
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
            
  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drone_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .[database,api]
          
      - name: Setup MinIO buckets
        run: |
          pip install minio
          python scripts/setup_minio.py --endpoint localhost:9000 \
            --access-key minioadmin \
            --secret-key minioadmin123
          
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/drone_test
        run: |
          python scripts/migrate.py upgrade head
          
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/drone_test
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          USE_MOCK_HARDWARE: "true"
          TESTING: "true"
        run: |
          pytest tests/integration/ \
            -v \
            --cov=app \
            --cov-append \
            --junitxml=integration-test-results.xml \
            -m "integration"
            
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-test-results.xml
          
  # ============================================================================
  # Hardware Tests (with mock hardware)
  # ============================================================================
  hardware-tests:
    name: Hardware Tests (Mock)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .[sdr]
          
      - name: Run hardware tests (mock mode)
        env:
          USE_MOCK_HARDWARE: "true"
        run: |
          pytest tests/hardware/ \
            -v \
            --tb=short \
            -m "hardware"
            
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: hardware-test-results
          path: hardware-test-results.xml
          
  # ============================================================================
  # Performance Tests
  # ============================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          
      - name: Run performance benchmarks
        env:
          USE_MOCK_HARDWARE: "true"
        run: |
          pytest tests/performance/ \
            -v \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-histogram \
            --benchmark-compare \
            --benchmark-columns=min,max,mean,stddev,rounds,iterations
          
      - name: Store benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .benchmarks/
          
  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      - name: Run dependency scanning
        run: |
          pip install safety
          safety check -r requirements.txt --full-report
          
      - name: Run secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          output: trufflehog-results.json
          
  # ============================================================================
  # Build & Package
  # ============================================================================
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine
          
      - name: Build package
        run: |
          python -m build
          twine check dist/*
          
      - name: Build Docker image
        run: |
          docker build -t drone-detector:test -f docker/Dockerfile .
          docker save drone-detector:test | gzip > drone-detector-test.tar.gz
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            drone-detector-test.tar.gz
            
  # ============================================================================
  # Documentation
  # ============================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install documentation dependencies
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions
          
      - name: Build documentation
        run: |
          mkdocs build --strict
          
      - name: Check broken links
        run: |
          pip install linkchecker
          linkchecker docs/
          
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
          
  # ============================================================================
  # Code Coverage Report
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-data
          
      - name: Combine coverage reports
        run: |
          pip install coverage
          coverage combine coverage-data/**/.coverage*
          coverage xml -o coverage-final.xml
          coverage html -d coverage-html
          
      - name: Upload combined coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage-final.xml
          flags: combined
          name: drone-detector-coverage
          
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          
  # ============================================================================
  # Notifications
  # ============================================================================
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [build, docs, performance-tests, coverage]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: Check status
        id: status
        run: |
          if [ "${{ needs.build.result }}" == "success" ] && \
             [ "${{ needs.docs.result }}" == "success" ] && \
             [ "${{ needs.performance-tests.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
          
      - name: Send Slack notification on failure
        if: steps.status.outputs.status == 'failure' && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1.24
        with:
          payload: |
            {
              "text": "❌ CI/CD Pipeline Failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *CI/CD Pipeline Failed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nWorkflow: ${{ github.workflow }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
      - name: Send success notification on main branch
        if: steps.status.outputs.status == 'success' && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1.24
        with:
          payload: |
            {
              "text": "✅ CI/CD Pipeline Passed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *CI/CD Pipeline Passed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nWorkflow: ${{ github.workflow }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}