# Docker Compose configuration for Drone Detector Dev Container
# Provides complete development environment with all services

version: '3.8'

# ============================================================================
# Networks
# ============================================================================
networks:
  dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  minio_data_dev:
    driver: local
  drone_data_dev:
    driver: local
  drone_logs_dev:
    driver: local
  drone_models_dev:
    driver: local
  python_cache_dev:
    driver: local
  npm_cache_dev:
    driver: local

# ============================================================================
# Services
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # Main Development Container
  # --------------------------------------------------------------------------
  dev-container:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USERNAME: vscode
        USER_UID: 1000
        USER_GID: 1000
    image: drone-detector-dev:latest
    container_name: drone-dev-container
    restart: unless-stopped
    
    environment:
      # Python
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      
      # Environment
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      USE_MOCK_HARDWARE: "true"
      
      # Database
      DATABASE_URL: postgresql://drone_user:drone_password@postgres:5432/drone_detector
      REDIS_URL: redis://:redis_password@redis:6379
      
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      
      # Hardware
      HARDWARE_TYPE: mock
      SAMPLE_RATE: 2000000
      CENTER_FREQUENCY: 2450000000
      GAIN: 20
      
      # Testing
      TESTING: "true"
      PYTEST_ADDOPTS: "--color=yes"
      
      # Development
      RUN_DRONE_DETECTOR: "false"
      DEBUGGER_PORT: 5678
      
    volumes:
      # Workspace
      - ..:/workspace:rw
      
      # Cache volumes
      - python_cache_dev:/home/vscode/.cache/pip
      - python_cache_dev:/home/vscode/.local
      - npm_cache_dev:/home/vscode/.npm
      
      # Data volumes
      - drone_data_dev:/workspace/data
      - drone_logs_dev:/workspace/logs
      - drone_models_dev:/workspace/models
      
      # Docker socket (for Docker-in-Docker)
      - /var/run/docker.sock:/var/run/docker.sock
      
      # USB devices (for SDR hardware)
      - /dev/bus/usb:/dev/bus/usb
      
      # SSH agent (optional)
      - ${SSH_AUTH_SOCK}:/tmp/ssh-agent.sock
      
    ports:
      # API & WebSocket
      - "8888:8888"
      - "8889:8889"
      
      # Debugger
      - "5678:5678"
      
      # Jupyter
      - "8888:8888"
      
      # Database ports (for local tools)
      - "5432:5432"
      - "6379:6379"
      
      # Monitoring
      - "3000:3000"
      - "9090:9090"
      
      # MinIO
      - "9000:9000"
      - "9001:9001"
      
      # Admin interfaces
      - "5050:5050"
      - "8081:8081"
      
    networks:
      - dev-network
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
      
    cap_add:
      - SYS_PTRACE
      - SYS_NICE
      - IPC_LOCK
      - NET_ADMIN
      - NET_RAW
    
    security_opt:
      - seccomp:unconfined
    
    command: ["bash"]
    
    stdin_open: true
    tty: true

  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: drone-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drone_detector
      POSTGRES_USER: drone_user
      POSTGRES_PASSWORD: drone_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../docker/postgres/dev-data.sql:/docker-entrypoint-initdb.d/dev-data.sql:ro
    ports:
      - "5432:5432"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone_user -d drone_detector"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Redis Cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: drone-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass redis_password
    environment:
      REDIS_PASSWORD: redis_password
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # MinIO Object Storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: drone-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BROWSER: "on"
    volumes:
      - minio_data_dev:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # MinIO Client (Initialize Buckets)
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: drone-dev-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/iq-recordings || true;
      mc mb local/spectrum-data || true;
      mc mb local/ml-models || true;
      mc mb local/exports || true;
      mc mb local/test-data || true;
      mc policy set download local/exports;
      mc policy set public local/test-data;
      exit 0;
      "
    networks:
      - dev-network

  # --------------------------------------------------------------------------
  # TimescaleDB (Time-series for analytics)
  # --------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: drone-dev-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: drone_analytics
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d drone_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # pgAdmin (Database GUI)
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: drone-dev-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@drone-detector.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ../docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    networks:
      - dev-network
    depends_on:
      - postgres
      - timescaledb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Redis Commander (Redis GUI)
  # --------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: drone-dev-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD: redis_password
      HTTP_USER: admin
      HTTP_PASSWORD: admin123
    ports:
      - "8081:8081"
    networks:
      - dev-network
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Grafana (Metrics Dashboard)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.0
    container_name: drone-dev-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
      GF_LOG_LEVEL: debug
    volumes:
      - ../docker/grafana/dashboards-dev:/etc/grafana/provisioning/dashboards:ro
      - ../docker/grafana/datasources-dev:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - dev-network
    depends_on:
      - prometheus
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Prometheus (Metrics Collection)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: drone-dev-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--log.level=debug'
    volumes:
      - ../docker/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - ../docker/prometheus/alerts-dev.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Loki (Log Aggregation)
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: drone-dev-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml -log.level=debug
    volumes:
      - ../docker/loki/loki-config-dev.yaml:/etc/loki/loki-config.yaml:ro
      - drone_logs_dev:/loki
    ports:
      - "3100:3100"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Vector (Log Shipping)
  # --------------------------------------------------------------------------
  vector:
    image: timberio/vector:0.33.0-alpine
    container_name: drone-dev-vector
    restart: unless-stopped
    volumes:
      - ../docker/vector/vector-dev.toml:/etc/vector/vector.toml:ro
      - ../logs:/var/log/drone-detector:ro
    networks:
      - dev-network
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Mailhog (Email Testing)
  # --------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: drone-dev-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - dev-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Jupyter Lab (Data Science)
  # --------------------------------------------------------------------------
  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: drone-dev-jupyter
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: dev_token
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ..:/workspace
      - ../notebooks:/home/jovyan/work/notebooks
      - drone_data_dev:/workspace/data
      - drone_models_dev:/workspace/models
    ports:
      - "8889:8888"
    networks:
      - dev-network
    depends_on:
      - postgres
      - redis
    command: >
      start.sh jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --NotebookApp.token='dev_token'
      --NotebookApp.password=''
    profiles:
      - data-science
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Nginx (Reverse Proxy for Development)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: drone-dev-nginx
    restart: unless-stopped
    volumes:
      - ../docker/nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ../docker/nginx/default-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ui:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    networks:
      - dev-network
    depends_on:
      - dev-container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# Profiles
# ============================================================================
# To use data-science profile: docker-compose --profile data-science up
# To use all services: docker-compose --profile "*" up