# Docker Compose configuration for Drone Detector System
# Full stack deployment with all services

version: '3.8'

# ============================================================================
# Networks
# ============================================================================
networks:
  drone-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  drone_data:
    driver: local
  drone_logs:
    driver: local
  drone_models:
    driver: local

# ============================================================================
# Services
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: drone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drone_detector}
      POSTGRES_USER: ${POSTGRES_USER:-drone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drone_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drone_user} -d ${POSTGRES_DB:-drone_detector}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # --------------------------------------------------------------------------
  # Redis Cache & Message Broker
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: drone-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.8'

  # --------------------------------------------------------------------------
  # MinIO Object Storage (for IQ recordings)
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: drone-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # --------------------------------------------------------------------------
  # Create MinIO Buckets (init container)
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: drone-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb local/iq-recordings || true;
      mc mb local/spectrum-data || true;
      mc mb local/ml-models || true;
      mc mb local/exports || true;
      mc policy set download local/iq-recordings;
      mc policy set download local/exports;
      exit 0;
      "
    networks:
      - drone-network

  # --------------------------------------------------------------------------
  # TimescaleDB (Time-series data for spectrum analytics)
  # --------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: drone-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-drone_analytics}
      POSTGRES_USER: ${TIMESCALE_USER:-analytics_user}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-analytics_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-analytics_user} -d ${TIMESCALE_DB:-drone_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # --------------------------------------------------------------------------
  # Grafana (Metrics Visualization)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.0
    container_name: drone-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000}
    volumes:
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - drone_logs:/var/log/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - drone-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'

  # --------------------------------------------------------------------------
  # Prometheus (Metrics Collection)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: drone-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - drone_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # --------------------------------------------------------------------------
  # Loki (Log Aggregation)
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: drone-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - drone_logs:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # Vector (Log Shipping)
  # --------------------------------------------------------------------------
  vector:
    image: timberio/vector:0.33.0-alpine
    container_name: drone-vector
    restart: unless-stopped
    volumes:
      - ./docker/vector/vector.toml:/etc/vector/vector.toml:ro
      - drone_logs:/var/log/drone-detector:ro
    networks:
      - drone-network
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "vector", "validate"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # SDR Hardware Service (HackRF / RTL-SDR)
  # --------------------------------------------------------------------------
  sdr-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: drone-detector:latest
    container_name: drone-sdr
    restart: unless-stopped
    privileged: true  # Required for USB access to SDR devices
    devices:
      - "/dev/bus/usb:/dev/bus/usb"  # USB device access
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD:-drone_password}@postgres:5432/${POSTGRES_DB:-drone_detector}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      HARDWARE_TYPE: ${HARDWARE_TYPE:-auto}
      SAMPLE_RATE: ${SAMPLE_RATE:-2000000}
      CENTER_FREQUENCY: ${CENTER_FREQUENCY:-2450000000}
      GAIN: ${GAIN:-20}
    volumes:
      - drone_data:/app/data
      - drone_logs:/app/logs
      - drone_models:/app/models
      - ./config:/app/config:ro
    ports:
      - "${API_PORT:-8888}:8888"
      - "${WEBSOCKET_PORT:-8889}:8889"
    networks:
      - drone-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    ulimits:
      memlock: -1
      stack: 67108864
    command: ["api"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # --------------------------------------------------------------------------
  # Background Worker Service
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: drone-detector:latest
    container_name: drone-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD:-drone_password}@postgres:5432/${POSTGRES_DB:-drone_detector}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - drone_data:/app/data
      - drone_logs:/app/logs
      - drone_models:/app/models
      - ./config:/app/config:ro
    networks:
      - drone-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["worker"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.3'

  # --------------------------------------------------------------------------
  # Scheduler Service (Celery Beat)
  # --------------------------------------------------------------------------
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: drone-detector:latest
    container_name: drone-beat
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD:-drone_password}@postgres:5432/${POSTGRES_DB:-drone_detector}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
    networks:
      - drone-network
    depends_on:
      - redis
      - postgres
    command: ["beat"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  # --------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: drone-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - drone-network
    depends_on:
      - sdr-service
      - grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

  # --------------------------------------------------------------------------
  # ML Inference Service (Optional - GPU enabled)
  # --------------------------------------------------------------------------
  ml-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: production-gpu
    image: drone-detector:prod-gpu
    container_name: drone-ml
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      USE_GPU: "true"
      MODEL_PATH: /app/models/classifier.pkl
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD:-drone_password}@postgres:5432/${POSTGRES_DB:-drone_detector}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
    volumes:
      - drone_models:/app/models
      - drone_data:/app/data
    ports:
      - "${ML_PORT:-8090}:8090"
    networks:
      - drone-network
    depends_on:
      - postgres
      - redis
    command: ["api"]
    profiles:
      - gpu

# ============================================================================
# Environment Variables (from .env file)
# ============================================================================
# You can override these in a .env file in the same directory
# Example:
#   POSTGRES_PASSWORD=secure_password_here
#   REDIS_PASSWORD=another_secure_password
#   HARDWARE_TYPE=hackrf
#   WORKER_REPLICAS=4