# Docker Compose configuration for Drone Detector Production Environment
# Optimized for performance, security, and high availability

version: '3.8'

# ============================================================================
# Networks
# ============================================================================
networks:
  drone-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
    driver_opts:
      com.docker.network.bridge.name: drone-net
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

  traefik-network:
    external: true
    name: traefik-network
    required: false

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      device: /mnt/drone-data/postgres
      o: bind
    external: false

  redis_data_prod:
    driver: local
    driver_opts:
      type: none
      device: /mnt/drone-data/redis
      o: bind
    external: false

  minio_data_prod:
    driver: local
    driver_opts:
      type: none
      device: /mnt/drone-data/minio
      o: bind
    external: false

  drone_data_prod:
    driver: local
    driver_opts:
      type: none
      device: /mnt/drone-data/app
      o: bind
    external: false

  drone_logs_prod:
    driver: local
    driver_opts:
      type: none
      device: /var/log/drone-detector
      o: bind
    external: false

  drone_models_prod:
    driver: local
    driver_opts:
      type: none
      device: /mnt/drone-data/models
      o: bind
    external: false

  prometheus_data_prod:
    driver: local
    driver_opts:
      type: none
      device: /mnt/drone-data/prometheus
      o: bind
    external: false

  grafana_data_prod:
    driver: local
    driver_opts:
      type: none
      device: /mnt/drone-data/grafana
      o: bind
    external: false

  loki_data_prod:
    driver: local
    driver_opts:
      type: none
      device: /mnt/drone-data/loki
      o: bind
    external: false

# ============================================================================
# Services
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database (Production)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: drone-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drone_detector}
      POSTGRES_USER: ${POSTGRES_USER:-drone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C --data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/prod-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/backup.sh:/usr/local/bin/backup.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drone_user} -d ${POSTGRES_DB:-drone_detector} -t 5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # --------------------------------------------------------------------------
  # Redis Cache (Production)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: drone-prod-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --port 6379
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --save 900 1
      --save 300 10
      --save 60 10000
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.3'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    sysctls:
      - net.core.somaxconn=65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # MinIO Object Storage (Production)
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: drone-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_PROMETHEUS_URL: "http://prometheus:9090"
    volumes:
      - minio_data_prod:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.2'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # MinIO Client (Initialize Buckets)
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: drone-prod-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/iq-recordings || true;
      mc mb local/spectrum-data || true;
      mc mb local/ml-models || true;
      mc mb local/exports || true;
      mc mb local/backups || true;
      mc policy set download local/exports;
      mc policy set private local/iq-recordings;
      mc policy set private local/spectrum-data;
      mc policy set private local/ml-models;
      mc version enable local/iq-recordings;
      mc version enable local/spectrum-data;
      mc ilm add --expiry-days 90 local/iq-recordings;
      mc ilm add --expiry-days 30 local/exports;
      exit 0;
      "
    networks:
      - drone-network

  # --------------------------------------------------------------------------
  # Main Application API (Production - Scalable)
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: production
    image: drone-detector:${TAG:-latest}
    container_name: drone-prod-api
    restart: always
    # Uncomment for USB SDR hardware access
    # privileged: true
    # devices:
    #   - "/dev/bus/usb:/dev/bus/usb"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drone_detector}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      HARDWARE_TYPE: ${HARDWARE_TYPE:-auto}
      SAMPLE_RATE: ${SAMPLE_RATE:-2000000}
      CENTER_FREQUENCY: ${CENTER_FREQUENCY:-2450000000}
      GAIN: ${GAIN:-20}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
    volumes:
      - drone_data_prod:/app/data
      - drone_logs_prod:/app/logs
      - drone_models_prod:/app/models
      - ./config:/app/config:ro
    ports:
      - "${API_PORT:-8888}:8888"
      - "${WEBSOCKET_PORT:-8889}:8889"
    networks:
      - drone-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drone-api.rule=Host(`${DOMAIN:-drone.local}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.drone-api.entrypoints=websecure"
      - "traefik.http.routers.drone-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.drone-api.loadbalancer.server.port=8888"
      - "com.centurylinklabs.watchtower.enable=true"

  # --------------------------------------------------------------------------
  # Background Worker (Production - Scalable)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: production
    image: drone-detector:${TAG:-latest}
    container_name: drone-prod-worker
    restart: always
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drone_detector}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - drone_data_prod:/app/data
      - drone_logs_prod:/app/logs
      - drone_models_prod:/app/models
      - ./config:/app/config:ro
    networks:
      - drone-network
    depends_on:
      - postgres
      - redis
      - minio
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 256M
          cpus: '0.3'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 2
        delay: 20s
        order: start-first
    healthcheck:
      test: ["CMD", "python", "-c", "from app.workers.worker import health; health()"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Scheduler (Production - Singleton)
  # --------------------------------------------------------------------------
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: production
    image: drone-detector:${TAG:-latest}
    container_name: drone-prod-beat
    restart: always
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drone_detector}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - drone-network
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
      restart_policy:
        condition: on-failure
        delay: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Prometheus (Production Metrics)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: drone-prod-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./docker/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts-prod.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data_prod:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.2'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Grafana (Production Dashboards)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.0
    container_name: drone-prod-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-https://grafana.drone.local}
      GF_SERVER_ENABLE_GZIP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
    volumes:
      - ./docker/grafana/dashboards-prod:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources-prod:/etc/grafana/provisioning/datasources:ro
      - grafana_data_prod:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - drone-network
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Loki (Production Log Aggregation)
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: drone-prod-loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config-prod.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data_prod:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Vector (Production Log Shipping)
  # --------------------------------------------------------------------------
  vector:
    image: timberio/vector:0.33.0-alpine
    container_name: drone-prod-vector
    restart: always
    volumes:
      - ./docker/vector/vector-prod.toml:/etc/vector/vector.toml:ro
      - drone_logs_prod:/var/log/drone-detector:ro
    networks:
      - drone-network
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Nginx Reverse Proxy (Production)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: drone-prod-nginx
    restart: always
    volumes:
      - ./docker/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./ui:/usr/share/nginx/html:ro
      - drone_logs_prod:/var/log/nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - drone-network
      - traefik-network
    depends_on:
      - api
      - grafana
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Watchtower (Automatic Updates)
  # --------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: drone-prod-watchtower
    restart: always
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 86400
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      WATCHTOWER_SCHEDULE: "0 0 3 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    networks:
      - drone-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    profiles:
      - auto-update

  # --------------------------------------------------------------------------
  # PostgreSQL Backup Service
  # --------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: drone-prod-backup
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-drone_detector}
      BACKUP_SCHEDULE: "0 2 * * *"
      BACKUP_RETENTION_DAYS: 30
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-drone-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/postgres/backup.sh:/backup.sh:ro
      - drone_data_prod:/backups
    networks:
      - drone-network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    profiles:
      - backup

# ============================================================================
# Production Notes:
# ============================================================================
# 1. Create required directories on host:
#    mkdir -p /mnt/drone-data/{postgres,redis,minio,app,models,prometheus,grafana,loki}
#    mkdir -p /var/log/drone-detector
#
# 2. Set permissions:
#    chown -R 999:999 /mnt/drone-data/postgres  # PostgreSQL user 999
#    chown -R 1000:1000 /mnt/drone-data/redis   # Redis user 1000
#    chown -R 1001:1001 /mnt/drone-data/minio   # MinIO user 1001
#
# 3. Create .env file with required secrets:
#    POSTGRES_PASSWORD=secure_password
#    REDIS_PASSWORD=secure_redis_password
#    MINIO_ROOT_USER=minioadmin
#    MINIO_ROOT_PASSWORD=secure_minio_password
#    SECRET_KEY=your_secret_key_here
#    GRAFANA_PASSWORD=secure_grafana_password
#
# 4. Deploy:
#    docker-compose -f docker-compose.prod.yml up -d
#
# 5. Scale services:
#    docker-compose -f docker-compose.prod.yml up -d --scale api=3 --scale worker=5
#
# 6. Update images:
#    docker-compose -f docker-compose.prod.yml pull
#    docker-compose -f docker-compose.prod.yml up -d