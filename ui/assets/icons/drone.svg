<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Drone Body -->
    <ellipse cx="12" cy="12" rx="4" ry="2" fill="currentColor" stroke="none"/>
    <rect x="10" y="10" width="4" height="4" rx="1" fill="currentColor" stroke="none"/>
    
    <!-- Drone Arms -->
    <line x1="8" y1="11" x2="4" y2="8" stroke="currentColor" stroke-width="2"/>
    <line x1="16" y1="11" x2="20" y2="8" stroke="currentColor" stroke-width="2"/>
    <line x1="8" y1="13" x2="4" y2="16" stroke="currentColor" stroke-width="2"/>
    <line x1="16" y1="13" x2="20" y2="16" stroke="currentColor" stroke-width="2"/>
    
    <!-- Propellers -->
    <ellipse cx="4" cy="8" rx="2" ry="4" fill="currentColor" opacity="0.7" stroke="none"/>
    <ellipse cx="20" cy="8" rx="2" ry="4" fill="currentColor" opacity="0.7" stroke="none"/>
    <ellipse cx="4" cy="16" rx="2" ry="4" fill="currentColor" opacity="0.7" stroke="none"/>
    <ellipse cx="20" cy="16" rx="2" ry="4" fill="currentColor" opacity="0.7" stroke="none"/>
    
    <!-- Propeller Blades -->
    <line x1="4" y1="6" x2="4" y2="10" stroke="currentColor" stroke-width="2"/>
    <line x1="20" y1="6" x2="20" y2="10" stroke="currentColor" stroke-width="2"/>
    <line x1="4" y1="14" x2="4" y2="18" stroke="currentColor" stroke-width="2"/>
    <line x1="20" y1="14" x2="20" y2="18" stroke="currentColor" stroke-width="2"/>
    
    <!-- Camera/Gimbal -->
    <circle cx="12" cy="14" r="2" fill="currentColor" opacity="0.5" stroke="none"/>
    <circle cx="12" cy="14" r="1" fill="none" stroke="currentColor" stroke-width="1"/>
    
    <!-- LED Lights -->
    <circle cx="10" cy="11" r="0.5" fill="#ff0000" stroke="none"/>
    <circle cx="14" cy="11" r="0.5" fill="#00ff00" stroke="none"/>
    <circle cx="10" cy="13" r="0.5" fill="#0000ff" stroke="none"/>
    <circle cx="14" cy="13" r="0.5" fill="#ffff00" stroke="none"/>
</svg>