<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Computer Monitor -->
    <rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="currentColor"/>
    
    <!-- Screen Glow -->
    <rect x="4" y="5" width="16" height="10" rx="1" fill="none" stroke="currentColor" opacity="0.3"/>
    
    <!-- Data Lines/Grid -->
    <line x1="6" y1="8" x2="10" y2="8" stroke="currentColor" opacity="0.4"/>
    <line x1="6" y1="10" x2="12" y2="10" stroke="currentColor" opacity="0.4"/>
    <line x1="6" y1="12" x2="8" y2="12" stroke="currentColor" opacity="0.4"/>
    <line x1="14" y1="8" x2="18" y2="8" stroke="currentColor" opacity="0.4"/>
    <line x1="14" y1="10" x2="18" y2="10" stroke="currentColor" opacity="0.4"/>
    <line x1="14" y1="12" x2="18" y2="12" stroke="currentColor" opacity="0.4"/>
    
    <!-- Stand -->
    <line x1="8" y1="17" x2="8" y2="21" stroke="currentColor"/>
    <line x1="16" y1="17" x2="16" y2="21" stroke="currentColor"/>
    <line x1="6" y1="21" x2="18" y2="21" stroke="currentColor"/>
    
    <!-- Power Indicator -->
    <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
</svg>