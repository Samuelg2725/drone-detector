<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Alert Triangle -->
    <path d="M12 2L2 20h20L12 2z" fill="none" stroke="currentColor"/>
    
    <!-- Exclamation Mark -->
    <line x1="12" y1="9" x2="12" y2="15" stroke="currentColor" stroke-width="3"/>
    <circle cx="12" cy="18" r="1.5" fill="currentColor" stroke="none"/>
    
    <!-- Warning Lines -->
    <line x1="4" y1="20" x2="8" y2="20" stroke="currentColor" opacity="0.5" stroke-width="1"/>
    <line x1="16" y1="20" x2="20" y2="20" stroke="currentColor" opacity="0.5" stroke-width="1"/>
    
    <!-- Pulse Effect -->
    <path d="M12 2L12 4" stroke="currentColor" opacity="0.3"/>
    <path d="M12 18L12 20" stroke="currentColor" opacity="0.3"/>
</svg>